# ---------------------------------------------------------------------------
# Full local parity stack: broker, database, and the complete observability
# chain. Everything the cloud deployment uses has a local stand-in, so the
# pipeline can be developed, load-tested and debugged with no GCP account and
# no spend. The only component with no local equivalent is BigQuery, which is
# why TP_BQ_ENABLED defaults to false.
#
#   docker compose up -d        (or: python tasks.py up)
#   Jaeger      http://localhost:16686
#   Prometheus  http://localhost:9090
#   Grafana     http://localhost:3000   (admin / admin)
# ---------------------------------------------------------------------------

name: transitpulse

services:
  postgres:
    image: postgres:16-alpine
    container_name: tp-postgres
    environment:
      POSTGRES_USER: transitpulse
      POSTGRES_PASSWORD: transitpulse
      POSTGRES_DB: transitpulse
      # Local-only: speeds up the load harness considerably by not waiting on
      # fsync. Never set this on anything whose data matters.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      # pg_stat_statements is what makes the "which query is slow" question
      # answerable during a load test.
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transitpulse -d transitpulse"]
      interval: 3s
      timeout: 3s
      retries: 20

  # The same Postgres with durability left switched ON, for one purpose: to
  # measure what `fsync=off` above is worth. Every write-path number this
  # project publishes comes from a database that does not wait for the disk,
  # which inflates it against any deployment whose data matters -- and "it is
  # faster" is not a measurement, so BENCHMARKS.md quotes both.
  #
  # Behind a profile, so `docker compose up` does not start it:
  #   docker compose --profile durable up -d postgres-durable
  #   python tasks.py durability
  #
  # Its own volume, because initdb refuses a directory another cluster owns,
  # and a tmpfs would defeat the point entirely.
  postgres-durable:
    profiles: ["durable"]
    image: postgres:16-alpine
    container_name: tp-postgres-durable
    environment:
      POSTGRES_USER: transitpulse
      POSTGRES_PASSWORD: transitpulse
      POSTGRES_DB: transitpulse
      POSTGRES_INITDB_ARGS: "--data-checksums"
    # No fsync or synchronous_commit overrides: these are Postgres's own
    # defaults (both on). The rest is kept identical to the service above so
    # the only difference between the two measurements is durability.
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
    ports:
      - "5433:5432"
    volumes:
      - pgdata-durable:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transitpulse -d transitpulse"]
      interval: 3s
      timeout: 3s
      retries: 20

  pubsub:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    container_name: tp-pubsub
    command: >
      gcloud beta emulators pubsub start
      --host-port=0.0.0.0:8085
      --project=transitpulse-local
    ports:
      - "8085:8085"
    healthcheck:
      # The emulator has no health endpoint; a refused TCP connect is the
      # signal, so we probe the port directly.
      test: ["CMD-SHELL", "curl -sf http://localhost:8085/ || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: tp-otel-collector
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC -- what the services export to
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus scrape endpoint for collected metrics
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: tp-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # UI
    # Jaeger's own OTLP ports stay internal; the collector is the single
    # ingress point so the services have exactly one endpoint to configure.
    expose:
      - "4317"

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: tp-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      # Mounted read-only alongside, not inside, the rules directory: the
      # rule_files glob would otherwise try to load the test file as a
      # rule group and reject the whole config.
      - ./observability/prometheus/rule_tests:/etc/prometheus/rule_tests:ro
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana:11.3.0
    container_name: tp-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: light
      # Where to send /render requests. Grafana itself cannot rasterise a
      # panel -- asked to, it answers 200 with a PNG that reads "No image
      # renderer available", which is a success code carrying a failure and
      # exactly the kind of thing this project checks rather than assumes.
      # Harmless when the renderer is not running: nothing calls /render
      # except the screenshot tool.
      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
    volumes:
      - ./observability/grafana:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  # Headless Chromium that turns a dashboard panel into a PNG. Behind a
  # profile because it is a few hundred megabytes and nothing but the
  # screenshot tool needs it:
  #
  #   docker compose --profile rendering up -d renderer
  #   python tasks.py screenshots
  #
  # No published port: Grafana reaches it over the compose network, and
  # exposing a headless browser that fetches arbitrary URLs on request is not
  # something to do by default.
  renderer:
    profiles: ["rendering"]
    image: grafana/grafana-image-renderer:v5.12.6
    container_name: tp-renderer
    environment:
      RENDERING_MODE: default
      # The panels are dark-on-dark by default and the committed screenshots
      # are read on a light page, so the tool asks for the light theme per
      # request; this only sets the default viewport.
      RENDERING_VIEWPORT_DEVICE_SCALE_FACTOR: "2"
    expose:
      - "8081"

volumes:
  pgdata:
  pgdata-durable:
