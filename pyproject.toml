[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "transitpulse"
version = "0.1.0"
description = "Cloud-native streaming pipeline for real-time transit telemetry"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aryan Nitin Kokabankar" }]

dependencies = [
    # --- core ---
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "structlog>=24.4",
    "orjson>=3.10",
    "tenacity>=9.0",
    "httpx>=0.27",
    # --- feed decoding ---
    "gtfs-realtime-bindings>=1.0.0",
    "protobuf>=4.25",
    # --- storage ---
    "psycopg[binary,pool]>=3.2",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13",
    # --- gcp ---
    "google-cloud-pubsub>=2.23",
    "google-cloud-bigquery>=3.26",
    "google-cloud-bigquery-storage>=2.27",
    "google-cloud-storage>=2.18",
    # --- serving ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.31",
    # --- observability ---
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-instrumentation-psycopg>=0.48b0",
    "opentelemetry-instrumentation-logging>=0.48b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.11",
    "testcontainers[postgres]>=4.8",
    "types-protobuf>=5.28",
    "freezegun>=1.5",
    # Imported directly by tests/unit/test_dashboard_contract.py to read the
    # Prometheus rule files and the Grafana datasource provisioning. Present
    # transitively via uvicorn[standard] today, which is not a contract --
    # declared for the same reason python-dotenv is, below.
    "PyYAML>=6.0",
    # Imported directly by tests/conftest.py to load the non-TP_ variables
    # (PUBSUB_EMULATOR_HOST, OTEL_*) that the Google and OTel SDKs read from
    # the environment. Declared explicitly rather than relied on as a
    # pydantic-settings transitive.
    "python-dotenv>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["libs/transitpulse_core"]

# ----------------------------------------------------------------------
# ruff
# ----------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["libs", "services", "tools", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "TID",      # tidy-imports
    "RUF",      # ruff-specific
    "ASYNC",    # async correctness
    "DTZ",      # timezone-aware datetimes (critical for this project)
    "S",        # bandit: this service parses untrusted protobuf off the internet
    "BLE",      # blind except: every broad catch must be justified in writing
]
ignore = [
    "E501",     # line length handled by formatter
    "B008",     # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.isort]
# Declared explicitly because `services` and `tools` are path-based packages
# rather than installed ones: ruff resolves them as first-party inside their
# own tree and third-party elsewhere, which puts the same import in two
# different groups depending on which file it appears in.
known-first-party = ["transitpulse_core", "services", "tools", "tests"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, bind to localhost, and use fixture-shaped names.
"tests/**" = ["N802", "N803", "S101", "S104", "S105", "S106", "S311"]
# Alembic's generated layout: revision-prefixed filenames, raw DDL strings.
"migrations/**" = ["N999", "I001", "S608"]
# The task runner shells out by design; that is its entire job.
"tasks.py" = ["S603", "S607"]

# ----------------------------------------------------------------------
# mypy
# ----------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_untyped_decorators = false
plugins = ["pydantic.mypy"]
mypy_path = "libs"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "google.transit.*",
    "google.cloud.*",
    "testcontainers.*",
    "opentelemetry.instrumentation.*",
]
ignore_missing_imports = true

# The google-cloud-bigquery-storage client's constructors are untyped, and
# this module is the only place that touches them. Scoped here rather than
# relaxed globally so the rest of the codebase stays under --strict.
[[tool.mypy.overrides]]
module = ["transitpulse_core.sinks.bigquery"]
disallow_untyped_calls = false

# ----------------------------------------------------------------------
# pytest
# ----------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["libs", "."]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: requires docker-compose stack (deselect with '-m \"not integration\"')",
    "slow: long-running load or chaos test",
]

[tool.coverage.run]
source = ["libs/transitpulse_core", "services", "tools"]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
