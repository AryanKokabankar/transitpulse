# Single ingress for all telemetry. The services only ever know about one
# endpoint (OTLP/gRPC on 4317); swapping Jaeger for Cloud Trace is a change
# here, not in application code.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # memory_limiter must be first in each pipeline so it can shed load before
  # the batcher accumulates more than the collector can hold.
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20
  batch:
    timeout: 2s
    send_batch_size: 1024
    send_batch_max_size: 2048
  resource/local:
    attributes:
      - key: deployment.environment
        value: local
        action: upsert

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
    # Keep OTel resource attributes as labels so panels can split by service.
    resource_to_telemetry_conversion:
      enabled: true
    enable_open_metrics: true
  debug:
    verbosity: basic

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/local, batch]
      exporters: [otlp/jaeger]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource/local, batch]
      exporters: [prometheus]
  telemetry:
    logs:
      level: warn
