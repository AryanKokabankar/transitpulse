# Single ingress for all telemetry. The services only ever know about one
# endpoint (OTLP/gRPC on 4317); swapping Jaeger for Cloud Trace is a change
# here, not in application code.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # memory_limiter must be first in each pipeline so it can shed load before
  # the batcher accumulates more than the collector can hold.
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20
  batch:
    timeout: 2s
    send_batch_size: 1024
    send_batch_max_size: 2048
  resource/local:
    attributes:
      - key: deployment.environment
        value: local
        action: upsert

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
    # Keep OTel resource attributes as labels so panels can split by service.
    resource_to_telemetry_conversion:
      enabled: true
    # Note for anyone writing a query against this endpoint: with OpenMetrics
    # on, histogram bucket boundaries are served as `le="2.0"` to Prometheus
    # and as `le="2"` to a plain curl. The two disagree, Prometheus stores the
    # OpenMetrics spelling, and a matcher written from what curl showed matches
    # nothing. See ADR-007.
    enable_open_metrics: true
    # Five minutes by default, which erases exactly the signals that matter
    # most. The partition job and the GTFS loader run once and exit, so each
    # exports its headroom gauge and success timestamp a single time; at the
    # default they vanish from the dashboard minutes later and the freshness
    # alert loses the series it is meant to be watching. Raised to an hour so
    # a local session can see them. The cloud deployment has no equivalent
    # shim and needs none -- Cloud Monitoring keeps the point that was written.
    metric_expiration: 1h
  debug:
    verbosity: basic

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/local, batch]
      exporters: [otlp/jaeger]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource/local, batch]
      exporters: [prometheus]
  telemetry:
    logs:
      level: warn
