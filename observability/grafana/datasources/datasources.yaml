apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    # Pinned, not left to Grafana. A provisioned datasource without an explicit
    # uid gets a generated one (PBFA97CFB590B2093 here), while the committed
    # dashboards reference it by the stable name -- so every panel resolved to
    # a datasource that did not exist and rendered an error rather than data.
    # The uid is the contract between the two files and belongs in both.
    uid: Prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 5s

  - name: Jaeger
    type: jaeger
    uid: Jaeger
    access: proxy
    url: http://jaeger:16686
