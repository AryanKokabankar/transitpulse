global:
  scrape_interval: 5s
  evaluation_interval: 15s
  external_labels:
    env: local

scrape_configs:
  # The collector re-exports everything the services pushed over OTLP.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
