name: ci

on:
  pull_request:
  push:
    branches: [main]

# A new push supersedes an in-flight run on the same ref; no point paying for
# CI on a commit that is already stale.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

permissions:
  contents: read

jobs:
  static:
    name: lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff check
        run: ruff check --output-format=github .

      - name: ruff format
        run: ruff format --check .

      - name: mypy
        run: mypy libs services tools

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: pytest
        run: pytest -m "not integration" --cov --cov-report=xml --cov-report=term

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-unit
          path: coverage.xml
          retention-days: 7

  terraform:
    name: terraform validate
    runs-on: ubuntu-latest
    # The infrastructure has never been applied -- there is no GCP project
    # behind this repository -- so `validate` is the only check available and
    # therefore the one that has to run. It is not a formality: the first
    # version of this configuration had a dependency cycle between the push
    # subscription and the Cloud Run service it delivers to, which validate
    # caught and no amount of reading would have.
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: fmt
        working-directory: infra/terraform
        run: terraform fmt -check -recursive -diff

      - name: init
        working-directory: infra/terraform
        # -backend=false: initialising the real GCS backend would need
        # credentials, and nothing here needs state to be type-checked.
        run: terraform init -backend=false -input=false

      - name: validate
        working-directory: infra/terraform
        run: terraform validate

  integration:
    name: integration tests
    runs-on: ubuntu-latest
    # Real Postgres and a real Pub/Sub emulator rather than mocks: the bugs
    # worth catching here are in the SQL and the broker semantics, and a mock
    # of either one would have the bug too.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: transitpulse
          POSTGRES_PASSWORD: transitpulse
          POSTGRES_DB: transitpulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U transitpulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # The Pub/Sub emulator is NOT a `services:` entry: that block cannot
    # override a container's command, and the emulator image needs
    # `gcloud beta emulators pubsub start ...`. It is started as a step below.

    env:
      TP_ENV: local
      TP_PG_DSN: postgresql://transitpulse:transitpulse@localhost:5432/transitpulse
      PUBSUB_EMULATOR_HOST: localhost:8085
      TP_GCP_PROJECT: transitpulse-ci
      TP_OTEL_ENABLED: "false"
      # The dashboard verification drives its load in subprocesses with
      # telemetry switched back on, and has to wait for each signal to reach
      # Prometheus. The SDK default of 60s between exports would make that
      # wait longer than the test.
      OTEL_METRIC_EXPORT_INTERVAL: "5000"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Start the Pub/Sub emulator
        run: |
          docker run -d --name pubsub-emulator -p 8085:8085 \
            gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators \
            gcloud beta emulators pubsub start --host-port=0.0.0.0:8085 \
            --project=transitpulse-ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8085/ >/dev/null; then echo ready; break; fi
            sleep 2
          done

      - name: Start the observability stack
        # The dashboard panels are verified against a real Prometheus holding
        # real metrics, so the test needs somewhere for OTLP to go and
        # something to query. Both run from the same config files the local
        # compose stack mounts -- a rules directory that fails to mount, or a
        # datasource uid that does not resolve, has to fail here rather than
        # on someone's laptop.
        #
        # On a user-defined network so Prometheus resolves the Collector by
        # the hostname its committed config already uses, with only the two
        # ports pytest needs published. Jaeger is left out: the traces
        # pipeline's exporter retries a name it cannot resolve without
        # affecting the metrics pipeline, and nothing here asserts on traces.
        run: |
          docker network create transitpulse-ci
          docker run -d --name otel-collector --network transitpulse-ci             -p 4317:4317 -p 8889:8889             -v "$PWD/observability/otel-collector.yaml:/etc/otel/config.yaml:ro"             otel/opentelemetry-collector-contrib:0.111.0             --config=/etc/otel/config.yaml
          docker run -d --name prometheus --network transitpulse-ci             -p 9090:9090             -v "$PWD/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro"             -v "$PWD/observability/prometheus/rules:/etc/prometheus/rules:ro"             -v "$PWD/observability/prometheus/rule_tests:/etc/prometheus/rule_tests:ro"             prom/prometheus:v2.55.0             --config.file=/etc/prometheus/prometheus.yml             --storage.tsdb.retention.time=6h
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9090/-/ready >/dev/null; then echo ready; break; fi
            sleep 2
          done

      - name: Check the Prometheus rules and run their unit tests
        # Two different failures, both invisible to every Python test.
        # `check config` catches a rule file that will not load at all -- a
        # promtool test file left inside the rule_files glob did exactly that.
        # `test rules` catches a rule that loads and then evaluates to the
        # wrong thing, which is how a paging alert once fired for ten minutes
        # while the system it watched was perfectly healthy.
        run: |
          docker exec prometheus promtool check config /etc/prometheus/prometheus.yml
          docker exec prometheus promtool test rules /etc/prometheus/rule_tests/alerts_test.yml

      - name: Migrate
        run: alembic upgrade head

      - name: Verify migrations are reversible
        # A migration that cannot roll back is a migration you cannot deploy on
        # a Friday. Cheap to check, so it is checked every run.
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: pytest
        run: pytest -m integration -v

  image:
    name: build + scan
    runs-on: ubuntu-latest
    needs: [static, unit]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: transitpulse:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report image size
        # Printed in the job summary so an accidental 1GB image is visible in
        # the PR rather than discovered at deploy time.
        run: |
          SIZE=$(docker image inspect transitpulse:${{ github.sha }} \
            --format '{{.Size}}')
          echo "### Image size: $((SIZE / 1024 / 1024)) MB" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke-test the entrypoint
        run: |
          docker run --rm -e TP_SERVICE=bogus transitpulse:${{ github.sha }} \
            && (echo "expected a non-zero exit for an unknown TP_SERVICE" && exit 1) \
            || echo "entrypoint rejects unknown services as expected"

      - name: Trivy scan
        # Tag carries a leading v -- written without one, this resolved to
        # nothing and the job failed before running a single step. Verified
        # against the repository's tag list, and the five inputs below against
        # this version's action.yaml, rather than recalled.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: transitpulse:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
